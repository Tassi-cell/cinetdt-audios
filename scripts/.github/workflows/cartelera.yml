name: Actualizar cartelera
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generar_cartelera.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Guardar cartelera.json
        run: |
          git config user.name "cartelera-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cartelera.json
          git diff --cached --quiet || (git commit -m "Actualizar cartelera" && git push)
